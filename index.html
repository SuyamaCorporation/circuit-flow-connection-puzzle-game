<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>回路基板フロー接続パズルゲーム</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { background: #0a0a1a; }
  canvas { touch-action: none; cursor: crosshair; }
  @keyframes spark { 0%{opacity:1;transform:scale(1)} 100%{opacity:0;transform:scale(2.5)} }
  .spark { animation: spark 0.6s ease-out forwards; }
  @keyframes fadeUp { from{opacity:1;transform:translateY(0)} to{opacity:0;transform:translateY(-20px)} }
  .fade-up { animation: fadeUp 1.2s ease-out forwards; }
</style>
</head>
<body class="text-white min-h-screen">
<div class="max-w-lg mx-auto p-3">
  <header class="text-center py-3">
    <h1 class="text-xl font-bold" style="color:#00ff88">回路フロー接続パズル</h1>
    <p class="text-gray-400 text-xs mt-1">端子をつなぎ全マスを埋めろ</p>
  </header>

  <div class="flex justify-between items-center rounded-xl p-2 mb-3 gap-2" style="background:#111128">
    <div class="text-center">
      <div class="text-xs text-gray-400">レベル</div>
      <div id="lvl-num" class="font-bold" style="color:#00ff88">1</div>
    </div>
    <div class="text-center">
      <div class="text-xs text-gray-400">手数</div>
      <div id="move-count" class="font-bold text-cyan-400">0</div>
    </div>
    <div class="text-center">
      <div class="text-xs text-gray-400">時間</div>
      <div id="timer-display" class="font-bold text-yellow-400">0:00</div>
    </div>
    <button onclick="undoMove()" class="text-xs px-2 py-1 rounded" style="background:#1e1e3a;color:#aaa" aria-label="一手戻す">↩戻す</button>
    <button onclick="resetPuzzle()" class="text-xs px-2 py-1 rounded" style="background:#1e1e3a;color:#aaa" aria-label="リセット">🔄</button>
  </div>

  <!-- Level buttons -->
  <div class="flex gap-1 flex-wrap mb-3">
    <div id="level-btns" class="flex gap-1 flex-wrap"></div>
  </div>

  <div class="relative flex justify-center mb-3">
    <canvas id="puzzle-canvas" aria-label="パズルボード" role="application"></canvas>
    <div id="complete-msg" class="hidden absolute inset-0 flex items-center justify-center">
      <div class="rounded-2xl p-5 text-center" style="background:rgba(0,255,136,0.15);border:2px solid #00ff88">
        <div class="text-3xl mb-1">⚡</div>
        <div class="text-lg font-bold" style="color:#00ff88">Circuit Complete!</div>
        <div id="complete-stats" class="text-sm text-gray-300 mt-1"></div>
        <button onclick="nextLevel()" class="mt-3 px-4 py-2 rounded-lg text-sm font-bold" style="background:#00ff88;color:#0a0a1a">次のレベル →</button>
      </div>
    </div>
  </div>

  <p class="text-xs text-gray-500 text-center">ドラッグで経路を描画。全マスを埋めると完成。</p>
</div>

<script>
const PALETTE = ['#ff4466','#4488ff','#44cc44','#ffaa00','#aa44ff','#ff8844','#00cccc'];

const LEVELS = [
  // [size, [[r1,c1,r2,c2], ...]] pairs
  [5, [[0,0,4,0],[0,4,4,4],[2,0,2,4]]],
  [5, [[0,0,4,4],[0,4,4,0],[2,2,0,2]]],
  [5, [[0,0,0,4],[4,0,4,4],[1,0,3,4],[2,0,2,4]]],
  [6, [[0,0,5,5],[0,5,5,0],[0,2,5,2],[2,0,2,5]]],
  [6, [[0,0,5,0],[0,5,5,5],[1,1,4,4],[2,2,3,3]]],
  [6, [[0,0,0,5],[5,0,5,5],[1,0,4,0],[1,5,4,5],[2,2,3,3]]],
  [7, [[0,0,6,6],[0,6,6,0],[3,0,3,6],[0,3,6,3],[1,1,5,5]]],
  [7, [[0,0,6,0],[0,6,6,6],[1,1,5,5],[2,2,4,4],[3,0,3,6]]],
  [7, [[0,0,0,6],[6,0,6,6],[0,2,6,2],[0,4,6,4],[3,1,3,5],[1,3,5,3]]],
  [8, [[0,0,7,7],[0,7,7,0],[3,3,4,4],[0,3,7,3],[3,0,3,7],[1,1,6,6],[1,6,6,1]]],
];

let N = 5, pairs = [], paths = [], drawing = false, activeColor = -1;
let cells = [], moveHistory = [], moves = 0, timerStart = 0, timerInterval = null;
let currentLvl = 0;

function initLevel(idx) {
  currentLvl = idx;
  const [size, pairList] = LEVELS[idx % LEVELS.length];
  N = size;
  pairs = pairList.map((p, i) => ({ r1:p[0], c1:p[1], r2:p[2], c2:p[3], color: PALETTE[i] }));
  resetPuzzle();
  renderLevelButtons();
}

function resetPuzzle() {
  cells = Array.from({length: N}, () => Array.from({length: N}, () => ({ pairIdx: -1, type: 'empty' })));
  paths = pairs.map(() => []);
  drawing = false; activeColor = -1; moveHistory = []; moves = 0;
  document.getElementById('move-count').textContent = 0;
  document.getElementById('complete-msg').classList.add('hidden');
  document.getElementById('lvl-num').textContent = currentLvl + 1;
  stopTimer(); startTimer();
  setupCanvas();
  drawPuzzle();
}

function setupCanvas() {
  const canvas = document.getElementById('puzzle-canvas');
  const maxW = Math.min(380, window.innerWidth - 40);
  const size = Math.floor(maxW / N) * N;
  canvas.width = size; canvas.height = size;
  canvas.style.width = size + 'px'; canvas.style.height = size + 'px';
}

function cellSize() { return document.getElementById('puzzle-canvas').width / N; }

function drawPuzzle() {
  const canvas = document.getElementById('puzzle-canvas');
  const ctx = canvas.getContext('2d');
  const CS = cellSize();
  const W = canvas.width;
  ctx.clearRect(0, 0, W, W);

  // Background
  ctx.fillStyle = '#0d0d20'; ctx.fillRect(0, 0, W, W);

  // Grid lines
  ctx.strokeStyle = '#1e1e3a'; ctx.lineWidth = 1;
  for (let i = 0; i <= N; i++) {
    ctx.beginPath(); ctx.moveTo(i * CS, 0); ctx.lineTo(i * CS, W); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, i * CS); ctx.lineTo(W, i * CS); ctx.stroke();
  }

  // Draw paths
  paths.forEach((path, pIdx) => {
    if (path.length < 2) return;
    const color = pairs[pIdx].color;
    ctx.strokeStyle = color; ctx.lineWidth = CS * 0.45; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.globalAlpha = 0.7;
    ctx.beginPath();
    ctx.moveTo(path[0].c * CS + CS/2, path[0].r * CS + CS/2);
    path.slice(1).forEach(pt => ctx.lineTo(pt.c * CS + CS/2, pt.r * CS + CS/2));
    ctx.stroke();
    ctx.globalAlpha = 1;
  });

  // Draw terminals
  pairs.forEach((pair, pIdx) => {
    [[pair.r1, pair.c1], [pair.r2, pair.c2]].forEach(([r, c]) => {
      const cx = c * CS + CS/2, cy = r * CS + CS/2, rad = CS * 0.35;
      ctx.beginPath(); ctx.arc(cx, cy, rad, 0, Math.PI * 2);
      ctx.fillStyle = pair.color; ctx.fill();
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();

      const isConnected = paths[pIdx].some(p => p.r === r && p.c === c);
      if (isConnected) {
        ctx.beginPath(); ctx.arc(cx, cy, rad * 0.5, 0, Math.PI * 2);
        ctx.fillStyle = '#fff'; ctx.fill();
      }
    });
  });
}

function getCell(canvas, evt) {
  const rect = canvas.getBoundingClientRect();
  const CS = cellSize();
  let cx, cy;
  if (evt.touches) {
    cx = evt.touches[0].clientX - rect.left;
    cy = evt.touches[0].clientY - rect.top;
  } else {
    cx = evt.clientX - rect.left;
    cy = evt.clientY - rect.top;
  }
  const scale = document.getElementById('puzzle-canvas').width / rect.width;
  const col = Math.floor(cx * scale / CS);
  const row = Math.floor(cy * scale / CS);
  if (col < 0 || col >= N || row < 0 || row >= N) return null;
  return { r: row, c: col };
}

function findPairAtCell(r, c) {
  return pairs.findIndex(p => (p.r1 === r && p.c1 === c) || (p.r2 === r && p.c2 === c));
}

function startDraw(evt) {
  evt.preventDefault();
  const canvas = document.getElementById('puzzle-canvas');
  const cell = getCell(canvas, evt);
  if (!cell) return;
  const pIdx = findPairAtCell(cell.r, cell.c);
  if (pIdx === -1) return;

  moveHistory.push(paths.map(p => [...p]));
  activeColor = pIdx;
  paths[pIdx] = [cell];
  drawing = true;
  drawPuzzle();
}

function continueDraw(evt) {
  evt.preventDefault();
  if (!drawing || activeColor === -1) return;
  const canvas = document.getElementById('puzzle-canvas');
  const cell = getCell(canvas, evt);
  if (!cell) return;
  const path = paths[activeColor];
  if (path.length === 0) return;
  const last = path[path.length - 1];
  if (last.r === cell.r && last.c === cell.c) return;

  // Only allow adjacent cells
  if (Math.abs(last.r - cell.r) + Math.abs(last.c - cell.c) !== 1) return;

  // Check if another path occupies cell (and it's not a terminal)
  const occupier = paths.findIndex((p, i) => i !== activeColor && p.some(pt => pt.r === cell.r && pt.c === cell.c));
  if (occupier !== -1) {
    const isTerminal = findPairAtCell(cell.r, cell.c) !== -1;
    if (!isTerminal) return;
  }

  // Backtrack if re-entering our own path
  const ownIdx = path.findIndex(pt => pt.r === cell.r && pt.c === cell.c);
  if (ownIdx !== -1) {
    paths[activeColor] = path.slice(0, ownIdx + 1);
    drawPuzzle(); return;
  }

  paths[activeColor].push(cell);
  moves++;
  document.getElementById('move-count').textContent = moves;
  drawPuzzle();
  checkComplete();
}

function endDraw(evt) {
  drawing = false;
  activeColor = -1;
}

function undoMove() {
  if (moveHistory.length === 0) return;
  paths = moveHistory.pop();
  drawPuzzle();
}

function checkComplete() {
  const totalCells = N * N;
  const coveredSet = new Set();
  let allConnected = true;

  pairs.forEach((pair, pIdx) => {
    const path = paths[pIdx];
    if (path.length === 0) { allConnected = false; return; }
    const start = path[0], end = path[path.length - 1];
    const startsAtTerminal = (start.r === pair.r1 && start.c === pair.c1) || (start.r === pair.r2 && start.c === pair.c2);
    const endsAtTerminal = (end.r === pair.r1 && end.c === pair.c1) || (end.r === pair.r2 && end.c === pair.c2);
    if (!startsAtTerminal || !endsAtTerminal || path.length < 2) { allConnected = false; }
    path.forEach(pt => coveredSet.add(pt.r + ',' + pt.c));
  });

  if (allConnected && coveredSet.size === totalCells) {
    stopTimer();
    const stats = document.getElementById('complete-stats');
    const elapsed = Math.floor((Date.now() - timerStart) / 1000);
    stats.textContent = '手数: ' + moves + ' ｜ 時間: ' + formatTime(elapsed);
    document.getElementById('complete-msg').classList.remove('hidden');

    const done = JSON.parse(localStorage.getItem('circuit-done') || '[]');
    if (!done.includes(currentLvl)) { done.push(currentLvl); localStorage.setItem('circuit-done', JSON.stringify(done)); }
    renderLevelButtons();
  }
}

function nextLevel() {
  if (currentLvl + 1 < LEVELS.length) initLevel(currentLvl + 1);
  else initLevel(0);
}

function startTimer() {
  timerStart = Date.now();
  timerInterval = setInterval(() => {
    const elapsed = Math.floor((Date.now() - timerStart) / 1000);
    document.getElementById('timer-display').textContent = formatTime(elapsed);
  }, 1000);
}

function stopTimer() { clearInterval(timerInterval); }
function formatTime(s) { return Math.floor(s/60) + ':' + String(s%60).padStart(2,'0'); }

function renderLevelButtons() {
  const done = JSON.parse(localStorage.getItem('circuit-done') || '[]');
  const container = document.getElementById('level-btns');
  container.innerHTML = '';
  LEVELS.forEach((_, i) => {
    const btn = document.createElement('button');
    btn.textContent = i + 1;
    btn.className = 'text-xs px-2 py-1 rounded ';
    if (i === currentLvl) btn.style.cssText = 'background:#00ff88;color:#0a0a1a;';
    else if (done.includes(i)) btn.style.cssText = 'background:#1a3a1a;color:#44cc44;';
    else btn.style.cssText = 'background:#1e1e3a;color:#888;';
    btn.setAttribute('aria-label', 'レベル ' + (i + 1));
    btn.onclick = () => initLevel(i);
    container.appendChild(btn);
  });
}

const canvas = document.getElementById('puzzle-canvas');
canvas.addEventListener('mousedown', startDraw);
canvas.addEventListener('mousemove', continueDraw);
canvas.addEventListener('mouseup', endDraw);
canvas.addEventListener('touchstart', startDraw, { passive: false });
canvas.addEventListener('touchmove', continueDraw, { passive: false });
canvas.addEventListener('touchend', endDraw);

initLevel(0);
</script>
</body>
</html>
